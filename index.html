<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compañero de escritorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #d9e3ec;
    --navy: #17213a;
    --slate: #4a5878;
    --gold: #f4c95d;
    --white: #ffffff;
    --line: #b6c6d7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--mist);
    color: var(--navy);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 560px;
    padding: 20px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { margin: 4px 0 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }

  /* ---------- La pantalla con la cara ---------- */
  .device {
    background: var(--navy);
    border-radius: 36px;
    aspect-ratio: 4 / 3;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .device::after {
    content: "";
    position: absolute;
    inset: 14px;
    border-radius: 24px;
    border: 3px solid var(--gold);
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
  }
  .device[data-state="listening"]::after { opacity: .9; animation: ring 1.6s ease-in-out infinite; }
  .face { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .eyes { display: flex; gap: clamp(44px, 14vw, 72px); transition: transform .5s ease; }
  .eye {
    width: clamp(36px, 11vw, 52px);
    height: clamp(54px, 17vw, 78px);
    background: var(--gold);
    border-radius: 999px;
    transform-origin: center;
    transition: height .3s ease;
    animation: blink 5.5s infinite;
  }
  .eye:nth-child(2) { animation-delay: .04s; }
  .mouth {
    width: 52px; height: 7px;
    background: var(--gold);
    border-radius: 999px;
    opacity: .35;
    transition: opacity .2s;
  }
  .device[data-state="listening"] .eye { height: clamp(66px, 21vw, 96px); }
  .device[data-state="thinking"] .eyes { animation: look 2.4s ease-in-out infinite; }
  .device[data-state="thinking"] .eye { height: clamp(34px, 11vw, 48px); }
  .device[data-state="speaking"] .mouth { opacity: 1; animation: talk .42s ease-in-out infinite; }

  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
  @keyframes ring { 0%, 100% { transform: scale(1); } 50% { transform: scale(.985); } }
  @keyframes look { 0%, 100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }
  @keyframes talk { 0%, 100% { transform: scaleY(1) scaleX(1); } 50% { transform: scaleY(3.2) scaleX(.8); } }

  .status { margin: 0; text-align: center; font-weight: 600; color: var(--slate); min-height: 1.4em; }
  .live { margin: -8px 0 0; text-align: center; color: var(--slate); font-style: italic; min-height: 1.3em; }

  /* ---------- Controles ---------- */
  button, input, select, textarea { font: inherit; color: inherit; }
  .talk {
    background: var(--gold);
    color: var(--navy);
    border: 0;
    border-radius: 999px;
    padding: 16px 24px;
    font-weight: 800;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .talk[aria-pressed="true"] { background: var(--navy); color: var(--gold); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid var(--navy);
    outline-offset: 2px;
  }
  .type { display: flex; gap: 8px; }
  .type input {
    flex: 1; min-width: 0;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .type button {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0 18px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ---------- Conversación ---------- */
  .log {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 32dvh; overflow-y: auto;
    padding: 2px;
  }
  .log:empty::before {
    content: "Pulsa Hablar y empieza a charlar. También puedes escribir.";
    color: var(--slate);
  }
  .msg { margin: 0; padding: 9px 14px; border-radius: 16px; max-width: 86%; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: var(--white); }
  .msg.bot { align-self: flex-start; background: transparent; padding-left: 2px; }
  .msg.error { align-self: stretch; max-width: 100%; background: #f6d9d4; color: #7a2418; }

  /* ---------- Ajustes ---------- */
  details { border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; font-weight: 600; color: var(--slate); }
  .settings { display: grid; gap: 12px; margin-top: 14px; }
  .settings label { display: grid; gap: 4px; font-size: .92rem; color: var(--slate); }
  .settings input, .settings select, .settings textarea {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    color: var(--navy);
  }
  .settings textarea { resize: vertical; min-height: 64px; }
  .settings .clear {
    justify-self: start;
    background: transparent;
    border: 1px solid var(--slate);
    border-radius: 12px;
    padding: 8px 14px;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .eye, .eyes, .mouth, .device::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1 id="title">Pixel</h1>

  <div class="device" id="device" data-state="idle" aria-hidden="true">
    <div class="face">
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      <div class="mouth"></div>
    </div>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="live" id="live"></p>

  <button class="talk" id="talk" aria-pressed="false">Hablar</button>

  <form class="type" id="form" autocomplete="off">
    <input id="text" type="text" placeholder="O escribe aquí" aria-label="Escribir un mensaje">
    <button type="submit">Enviar</button>
  </form>

  <div class="log" id="log" aria-live="polite"></div>

  <details id="settingsBox">
    <summary>Ajustes</summary>
    <div class="settings">
      <label>Nombre del compañero
        <input id="name" type="text" maxlength="30">
      </label>
      <label>Idioma
        <select id="lang">
          <option value="es-ES">Español (España)</option>
          <option value="es-MX">Español (México)</option>
          <option value="ca-ES">Català</option>
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
        </select>
      </label>
      <label>Voz
        <select id="voice"></select>
      </label>
      <label>Velocidad de la voz
        <input id="rate" type="range" min="0.8" max="1.3" step="0.05">
      </label>
      <label>Personalidad (opcional)
        <textarea id="extra" maxlength="500" placeholder="Ej: bromista, me anima cuando me bloqueo, me recuerda hacer pausas"></textarea>
      </label>
      <label>Código de acceso (si lo has configurado en Netlify)
        <input id="code" type="password" autocomplete="off">
      </label>
      <button class="clear" id="clear" type="button">Borrar conversación</button>
    </div>
  </details>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const device = $("#device"), statusEl = $("#status"), liveEl = $("#live"), logEl = $("#log");
  const talkBtn = $("#talk"), form = $("#form"), textIn = $("#text");

  // Ajustes guardados en el navegador (con protección por si no hay acceso a localStorage)
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  const cfg = {
    name: store.get("name", "Pixel"),
    lang: store.get("lang", "es-ES"),
    voice: store.get("voice", ""),
    rate: parseFloat(store.get("rate", "1")) || 1,
    extra: store.get("extra", ""),
    code: store.get("code", "")
  };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let history = [];
  let active = false;      // modo conversación (escucha en bucle)
  let busy = false;        // pensando o hablando
  let state = "idle";
  let turn = 0;            // para descartar respuestas antiguas si se cancela
  let recognition = null;
  let stopSpeech = () => {};

  /* ---------- Estado visual ---------- */
  function setState(s) {
    state = s;
    device.dataset.state = s;
    const labels = {
      idle: `${cfg.name} está listo`,
      listening: "Te escucho",
      thinking: "Pensando…",
      speaking: `${cfg.name} está hablando`
    };
    statusEl.textContent = labels[s];
  }
  function refreshBtn() {
    talkBtn.setAttribute("aria-pressed", String(active));
    talkBtn.textContent = active ? "Parar" : "Hablar";
  }
  function addMsg(kind, text) {
    const p = document.createElement("p");
    p.className = "msg " + kind;
    p.textContent = text;
    logEl.appendChild(p);
    logEl.scrollTop = logEl.scrollHeight;
  }

  /* ---------- Escuchar ---------- */
  function stopListening() {
    if (!recognition) return;
    recognition.onend = null;
    recognition.onerror = null;
    try { recognition.abort(); } catch {}
    recognition = null;
    liveEl.textContent = "";
  }

  function listen() {
    if (!SR || !active || busy) return;
    stopListening();
    const r = new SR();
    r.lang = cfg.lang;
    r.interimResults = true;
    r.continuous = false;
    let finalText = "";

    r.onstart = () => setState("listening");
    r.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t; else interim += t;
      }
      liveEl.textContent = finalText + interim;
    };
    r.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        active = false; refreshBtn(); setState("idle");
        addMsg("error", "No tengo permiso para usar el micrófono. Actívalo en el candado de la barra de direcciones y vuelve a pulsar Hablar.");
      }
    };
    r.onend = () => {
      recognition = null;
      liveEl.textContent = "";
      if (finalText.trim()) send(finalText.trim());
      else if (active && !busy) setTimeout(listen, 250);
    };
    recognition = r;
    try { r.start(); } catch {}
  }

  /* ---------- Hablar ---------- */
  let voices = [];
  function loadVoices() {
    voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    const sel = $("#voice");
    const prefix = cfg.lang.slice(0, 2);
    sel.innerHTML = "";
    sel.add(new Option("Automática", ""));
    voices.filter((v) => v.lang.toLowerCase().startsWith(prefix)).forEach((v) => {
      sel.add(new Option(`${v.name} (${v.lang})`, v.name));
    });
    sel.value = cfg.voice;
    if (sel.value !== cfg.voice) sel.value = "";
  }
  function pickVoice() {
    return voices.find((v) => v.name === cfg.voice)
      || voices.find((v) => v.lang === cfg.lang)
      || voices.find((v) => v.lang.toLowerCase().startsWith(cfg.lang.slice(0, 2)));
  }

  function speak(text) {
    return new Promise((resolve) => {
      if (!window.speechSynthesis) return resolve();
      const clean = text.replace(/[*_#`>~]/g, "").replace(/\s+/g, " ").trim();
      // Se habla por frases: así Chrome no corta las respuestas largas.
      const chunks = clean.split(/(?<=[.!?…])\s+/).filter(Boolean);
      if (!chunks.length) return resolve();
      setState("speaking");
      let i = 0;
      const next = () => {
        if (i >= chunks.length) return resolve();
        const u = new SpeechSynthesisUtterance(chunks[i++]);
        u.lang = cfg.lang;
        u.rate = cfg.rate;
        const v = pickVoice();
        if (v) u.voice = v;
        u.onend = next;
        u.onerror = () => resolve();
        speechSynthesis.speak(u);
      };
      stopSpeech = () => { i = chunks.length; speechSynthesis.cancel(); resolve(); };
      next();
    });
  }

  /* ---------- Pensar (llamada a la función de Netlify) ---------- */
  async function send(text) {
    const my = ++turn;
    busy = true;
    stopListening();
    stopSpeech();
    addMsg("user", text);
    history.push({ role: "user", content: text });
    history = history.slice(-20);
    setState("thinking");

    try {
      const res = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-access-code": cfg.code },
        body: JSON.stringify({ messages: history, name: cfg.name, extra: cfg.extra, lang: cfg.lang })
      });
      const data = await res.json().catch(() => ({}));
      if (my !== turn) return;
      if (res.status === 401) $("#settingsBox").open = true;
      if (!res.ok) throw new Error(data.error || `Error ${res.status}. ¿Está desplegada la función de Netlify?`);

      history.push({ role: "assistant", content: data.reply });
      addMsg("bot", data.reply);
      await speak(data.reply);
    } catch (err) {
      if (my !== turn) return;
      history.pop();
      addMsg("error", err.message || "Algo ha fallado. Inténtalo otra vez.");
      active = false; refreshBtn();
    }
    if (my !== turn) return;
    busy = false;
    if (active) listen(); else setState("idle");
  }

  /* ---------- Controles ---------- */
  function toggle() {
    if (!SR) {
      addMsg("error", "Este navegador no admite reconocimiento de voz. Usa Chrome, Edge o Safari, o escribe abajo (yo sí te contesto hablando).");
      return;
    }
    active = !active;
    refreshBtn();
    if (active) {
      listen();
    } else {
      turn++;
      stopListening();
      stopSpeech();
      busy = false;
      setState("idle");
    }
  }

  talkBtn.addEventListener("click", toggle);
  // Tocar la cara mientras habla = interrumpir
  device.addEventListener("click", () => {
    if (state === "speaking") stopSpeech();
    else toggle();
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const t = textIn.value.trim();
    if (!t) return;
    textIn.value = "";
    send(t);
  });

  /* ---------- Ajustes ---------- */
  $("#name").value = cfg.name;
  $("#lang").value = cfg.lang;
  $("#rate").value = cfg.rate;
  $("#extra").value = cfg.extra;
  $("#code").value = cfg.code;
  $("#title").textContent = cfg.name;

  $("#name").addEventListener("input", (e) => {
    cfg.name = e.target.value.trim() || "Pixel";
    store.set("name", cfg.name);
    $("#title").textContent = cfg.name;
    if (state === "idle") setState("idle");
  });
  $("#lang").addEventListener("change", (e) => {
    cfg.lang = e.target.value; store.set("lang", cfg.lang);
    cfg.voice = ""; store.set("voice", "");
    loadVoices();
  });
  $("#voice").addEventListener("change", (e) => { cfg.voice = e.target.value; store.set("voice", cfg.voice); });
  $("#rate").addEventListener("input", (e) => { cfg.rate = parseFloat(e.target.value); store.set("rate", cfg.rate); });
  $("#extra").addEventListener("input", (e) => { cfg.extra = e.target.value; store.set("extra", cfg.extra); });
  $("#code").addEventListener("input", (e) => { cfg.code = e.target.value; store.set("code", cfg.code); });
  $("#clear").addEventListener("click", () => { history = []; logEl.innerHTML = ""; });

  if (window.speechSynthesis) {
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  }
  setState("idle");
})();
</script>
</body>
</html>
